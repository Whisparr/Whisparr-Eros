name: SonarQube

on:
  push:
    branches:
      - eros-develop
  pull_request_target:
    branches:
      - eros-develop
  workflow_dispatch:

env:
  # Keep in sync with build_v3.yml's VERSION_FALLBACK. Only used during the seed
  # window before any vX.Y.Z tag is reachable.
  VERSION_FALLBACK: 3.3.4

jobs:
  # Approval gate for fork PRs.
  #
  # SonarQube's .NET scanner needs SONAR_TOKEN at both `begin` and `end`, and C#
  # analysis needs a real `dotnet build`. A build executes whatever the head
  # branch says it should: Directory.Build.props/.targets, csproj PreBuild
  # targets, nuget.config feeds. Under pull_request_target that runs in the base
  # repo's context, with the base repo's secrets, which is the "pwn request"
  # shape that actions/checkout now refuses by default (see
  # https://gh.io/securely-using-pull_request_target).
  #
  # There is no way to analyse fork code automatically AND safely: a public
  # repo never exposes secrets to `pull_request` from a fork, by design. So the
  # unsafe checkout below is allowed only behind a human. The built-in "require
  # approval for fork pull requests" setting does NOT cover pull_request_target,
  # so the gate has to be an Environment with required reviewers.
  #
  # This job holds the environment and nothing else - it never checks out head
  # code, so it is safe to run before approval. Same-repo PRs, pushes and manual
  # dispatch skip it entirely and analysis proceeds unattended as before.
  #
  # REVIEWERS: the payload for a build-time attack lives in the build files, not
  # in the C# you would normally read. Before approving a fork run, read any
  # change to *.csproj, Directory.Build.*, nuget.config, global.json, build.sh,
  # package.json scripts or .github/ line by line.
  #
  # What this gate covers is deliberately kept to `dotnet build` and nothing
  # else. Coverage is collected in build_v3.yml, which runs under
  # `pull_request` with no secrets, and crosses over as an XML artifact -- so
  # fork *test* code never executes here. Keep it that way: do not add test
  # runs, `yarn install`, or any other fork-controlled execution to the analyze
  # job. Each one widens what a reviewer is implicitly approving.
  approve-fork-analysis:
    name: Approve fork analysis
    if: >-
      github.repository == 'Whisparr/Whisparr-Eros' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # This job only records the approval, so it needs no token scopes at all.
    permissions: {}
    # Create this in Settings > Environments with the maintainers as required
    # reviewers. Without required reviewers configured, the gate is a no-op.
    environment: sonar-fork-analysis
    steps:
      - name: Record approval
        # Via env, not inline interpolation - never expand webhook-controlled
        # values straight into a shell.
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Approved analysis of fork code from $HEAD_REPO@$HEAD_SHA"

  analyze:
    name: Build and Analyze
    needs: [approve-fork-analysis]
    # prevent runs outside default repo
    # 'skipped' is the same-repo / push / dispatch path, where no gate applies.
    if: >-
      !cancelled() &&
      github.repository == 'Whisparr/Whisparr-Eros' &&
      (needs.approve-fork-analysis.result == 'success' ||
       needs.approve-fork-analysis.result == 'skipped')
    runs-on: windows-latest
    # pull_request_target hands the job a write-scoped GITHUB_TOKEN by default.
    # Analysis only ever needs to read the tree, plus `actions: read` to pull
    # build_v3.yml's coverage artifact. Clamp it to that.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "zulu"
      # v7 refuses to check out fork PR code under pull_request_target or
      # workflow_run unless allow-unsafe-pr-checkout is set. It is set below,
      # behind the approve-fork-analysis gate, so this job is unaffected -- but
      # that input is load-bearing now, not decorative. Do not remove it while
      # this workflow keeps its pull_request_target trigger.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Gated by approve-fork-analysis above. Do not enable this checkout
          # anywhere that is not behind that gate.
          allow-unsafe-pr-checkout: true
      # Both caches below rotate weekly. An immutable key is always an exact
      # hit, and actions/cache skips the save on an exact hit, so a fixed key
      # means the cache is written once and never again. For the scanner that
      # is not just stale data: the install step below is gated on cache-hit,
      # so `dotnet tool update` would run exactly once, ever, freezing
      # dotnet-sonarscanner at whatever version happened to be current the
      # first time this job ran. The `-` suffixed restore-keys are prefix
      # fallbacks, so a new week still starts warm from the previous one and
      # then re-saves under the new key.
      - name: Compute weekly cache key
        id: cache-week
        shell: bash
        run: echo "week=$(date -u +'%Y-%V')" >> "$GITHUB_OUTPUT"
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v6
        with:
          path: ~\sonar\cache
          # "packages", not a bare "-sonar-" prefix: restore-keys matches on
          # prefix, and "<os>-sonar-" would also match the scanner cache below.
          key: ${{ runner.os }}-sonar-packages-${{ steps.cache-week.outputs.week }}
          restore-keys: ${{ runner.os }}-sonar-packages-
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner-${{ steps.cache-week.outputs.week }}
          restore-keys: ${{ runner.os }}-sonar-scanner-
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: src/**/*.csproj
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          # -Force because this step now also runs on a restore-keys partial
          # hit, where the directory already exists. `dotnet tool update` is
          # happy to update a tool-path that already holds an older scanner.
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      # NOTE: do not add an ESLint report import here. It would always be empty
      # -- build_v3.yml fails the frontend job on any lint finding, so every
      # commit that reaches analysis is already clean -- and generating it means
      # `yarn install` running fork-controlled lifecycle scripts in this job,
      # which holds SONAR_TOKEN. Sonar applies its own JS/TS rules to the ~108k
      # frontend ncloc regardless; that analysis needs no node toolchain here.
      # SonarCloud's New Code period is "previous_version", but nothing ever
      # passed sonar.projectVersion, so no version boundary has ever existed and
      # the branch's new-code window has been accumulating since the project was
      # created ("New code: since 5 months ago"). That is why eros-develop
      # reports ~14% new-code coverage while an individual PR reports 93% -- PR
      # analysis scopes new code to the PR diff and is unaffected.
      #
      # Base version only, deliberately: build_v3.yml's full version carries a
      # `-develop.<run_number>` suffix, and feeding that to Sonar would move the
      # boundary on every single push, shrinking new code to one commit. Using
      # the bare vX.Y.Z means new code == "since the last release tag", which is
      # what the metric is supposed to express.
      - name: Resolve project version
        id: version
        shell: bash
        run: |
          # Same reachability-scoped lookup build_v3.yml uses, same strict regex
          # (rejects the CI-minted -develop.N tags and the legacy 4-part
          # vX.Y.Z.B tags inherited from upstream).
          BASE_TAG=$(git tag --merged HEAD --sort=-v:refname 2>/dev/null \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "$BASE_TAG" ]; then
            BASE="${BASE_TAG#v}"
            echo "Analysing as version ${BASE} (from tag ${BASE_TAG})"
          else
            BASE="${VERSION_FALLBACK}"
            echo "Analysing as version ${BASE} (VERSION_FALLBACK; no vX.Y.Z tag reachable)"
          fi
          echo "version=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
        shell: powershell
        run: |
          $beginArgs = @(
            "/k:Whisparr_Whisparr-Eros",
            "/o:whisparr-eros",
            "/d:sonar.token=$env:SONAR_TOKEN",
            # Establishes the New Code boundary -- see "Resolve project version".
            "/v:$env:SONAR_VERSION",
            # Two groups of exclusions:
            #  - Localization/Core is 45 near-identical translation files,
            #    ~49.6k ncloc (17% of the project) and a large share of the
            #    duplication figure; counting them made neither number mean
            #    anything.
            #  - The binaries are icons, logos and test media fixtures. Sonar
            #    reads them as UTF-8 text and emits "Invalid character
            #    encountered in file ..." for each, which is what raises the
            #    "problems with file encoding" banner on the project summary.
            #    sonar.sourceEncoding is NOT the fix; they are not text in any
            #    encoding.
            "/d:sonar.exclusions=src/NzbDrone.Core/Localization/Core/**,**/node_modules/**,_output/**,_temp/**,_tests/**,**/*.ico,**/*.png,**/*.mp4,**/*.zip,**/*.tar.gz",
            "/d:sonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml"
          )
          if ($env:EVENT_NAME -eq 'pull_request_target') {
            $beginArgs += "/d:sonar.pullrequest.key=$env:PR_NUMBER"
            $beginArgs += "/d:sonar.pullrequest.branch=$env:PR_BRANCH"
            $beginArgs += "/d:sonar.pullrequest.base=$env:PR_BASE"
          }
          & ${{ runner.temp }}\scanner\dotnet-sonarscanner begin @beginArgs
          dotnet build src/Whisparr.sln

      # Coverage is NOT produced here. It comes from build_v3.yml's windows test
      # leg, which runs under `pull_request` with no secrets in scope -- so fork
      # test code never executes while this job holds SONAR_TOKEN. What crosses
      # the boundary is an XML report, i.e. data the scanner parses, not code it
      # runs. That keeps the approve-fork-analysis gate covering exactly what it
      # covered before: `dotnet build`, and nothing more.
      #
      # The two workflows are independent runs of the same commit with no
      # ordering guarantee, hence the wait. Missing coverage is not fatal: some
      # PRs never trigger build_v3.yml at all (it has paths-ignore for
      # localization and openapi.json), and analysis without coverage still
      # beats no analysis.
      - name: Download coverage from build_v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p coverage
          deadline=$(( SECONDS + 1500 ))
          while (( SECONDS < deadline )); do
            run_id=$(gh run list --repo "$REPO" --workflow build_v3.yml \
              --commit "$HEAD_SHA" --limit 1 \
              --json databaseId,status \
              --jq '.[] | select(.status=="completed") | .databaseId' || true)
            if [ -n "$run_id" ] && gh run download "$run_id" --repo "$REPO" \
                 --pattern 'coverage-*' --dir coverage; then
              echo "Coverage downloaded from build_v3 run $run_id"
              find coverage -name 'coverage.opencover.xml'
              exit 0
            fi
            sleep 30
          done
          echo "::warning::No coverage artifact for $HEAD_SHA; analysing without it."

      # Instrumenting is only half the job -- the report also has to name files
      # the scanner can find. <PathMap> makes coverlet record every document as
      # "./NzbDrone.Core/Foo.cs", but sonar.projectBaseDir is the repo root, so
      # the scanner looks for "<root>/NzbDrone.Core/Foo.cs" and the real file is
      # at "<root>/src/NzbDrone.Core/Foo.cs". Nothing matches, and the import
      # silently contributes zero without logging a single warning.
      #
      # Re-rooting the paths at $GITHUB_WORKSPACE/src fixes that. Do NOT solve
      # it by setting sonar.projectBaseDir=src instead: that would drop the
      # ~108k ncloc of frontend/ out of the analysis entirely.
      - name: Re-root coverage source paths
        shell: bash
        run: |
          set -uo pipefail
          # Git Bash reports GITHUB_WORKSPACE as D:\a\...; forward slashes are
          # accepted everywhere and keep the sed replacement free of escapes.
          ws="${GITHUB_WORKSPACE//\\//}"
          count=0
          while IFS= read -r f; do
            # Explicit temp file rather than `sed -i`: BSD sed requires an
            # argument to -i and GNU sed does not, and this step is the sort of
            # thing that gets copied to a macOS runner later.
            sed "s|fullPath=\"\./|fullPath=\"${ws}/src/|g" "$f" > "$f.tmp" \
              && mv "$f.tmp" "$f"
            count=$((count + 1))
          done < <(find coverage -name 'coverage.opencover.xml' 2>/dev/null)
          if [ "$count" -eq 0 ]; then
            echo "No coverage reports to re-root."
          else
            echo "Re-rooted $count report(s) at ${ws}/src"
          fi

      - name: Finish analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
