name: Deploy

on:
  workflow_call:
    inputs:
      framework:
        description: ".net framework"
        type: string
        required: true
      branch:
        description: "Git branch used for this build"
        type: string
        required: true
      major_version:
        description: "Whisparr major version"
        type: string
        required: true
      version:
        description: "Whisparr version"
        type: string
        required: true

jobs:
  package:
    strategy:
      matrix:
        include:
          - runtime: freebsd-x64
            os: ubuntu-latest
          - runtime: linux-arm
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-latest
          - runtime: linux-musl-arm64
            os: ubuntu-latest
          - runtime: linux-musl-x64
            os: ubuntu-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: osx-arm64
            os: ubuntu-latest
          - runtime: osx-x64
            os: ubuntu-latest
          - runtime: win-x64
            os: windows-latest
          - runtime: win-x86
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Package
        uses: ./.github/actions/package
        with:
          framework: ${{ inputs.framework }}
          runtime: ${{ matrix.runtime }}
          artifact: build-${{ matrix.runtime }}
          branch: ${{ inputs.branch }}
          major_version: ${{ inputs.major_version }}
          version: ${{ inputs.version }}

  release:
    if: ${{ github.ref_name == 'eros-develop' || github.ref_name == 'eros' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The changelog step walks PREV_TAG..CUR_TAG and the signed tag is cut
          # from this checkout, so the full commit graph and every tag have to be
          # here; tree:0 fetches that graph without the trees and blobs behind it.
          # fetch-tags is implied by fetch-depth: 0.
          fetch-depth: 0
          filter: tree:0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts
          pattern: release-*
          merge-multiple: true

      # cardinalby/git-get-release-action only scans a bounded window of recent
      # releases, so on eros it stopped finding the newest stable one once ~100
      # -develop prereleases piled up ahead of it. /releases/latest is defined as
      # the newest non-draft, non-prerelease release and has no window at all.
      - name: Get Previous Release
        id: previous-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.branch }}" == "eros" ]]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q '.tag_name')
          else
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              -q 'map(select(.prerelease and (.draft | not))) | .[0].tag_name // empty')
          fi

          if [[ -z "$tag" ]]; then
            echo "::error::No previous release found for branch ${{ inputs.branch }}"
            exit 1
          fi

          echo "Previous release: $tag"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Enable GPG signing
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_commit_gpgsign: true
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Create signed tag
        run: |
          git tag -s v${{ inputs.version }} -m "Release v${{ inputs.version }}"
          git push origin v${{ inputs.version }}
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate Commit Changelog
        id: generate-commit-changelog
        run: |
          PREV_TAG="${{ steps.previous-release.outputs.tag_name }}"
          CUR_TAG="v${{ inputs.version }}"
          echo "## What's Changed" > changelog.md
          git log "$PREV_TAG..$CUR_TAG" --pretty=format:"- %s (%h) - @%an" >> changelog.md
          cat changelog.md

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: _artifacts/Whisparr.*
          commit: ${{ github.sha }}
          generateReleaseNotes: false
          bodyFile: changelog.md
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.branch != 'eros' }}
          skipIfReleaseExists: true
          tag: v${{ inputs.version }}