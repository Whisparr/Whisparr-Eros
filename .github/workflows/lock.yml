name: 'Lock threads'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions: {}
jobs:
  lock:
    permissions:
      issues: write # to lock issues (dessant/lock-threads)
      pull-requests: write # to lock PRs (dessant/lock-threads)

    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: '90'
          exclude-issue-created-before: ''
          # The upstream tracking issues are long-lived by design; locking them
          # after 90 quiet days would silence the backlog they exist to show.
          exclude-any-issue-labels: 'upstream'
          add-issue-labels: ''
          issue-comment: ''
          issue-lock-reason: 'resolved'
          process-only: ''
