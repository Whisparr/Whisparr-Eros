name: Build
description: Build Whisparr for multiple platforms, run tests, create release

on:
  push:
    branches:
      - eros-develop
      - eros
  pull_request:
    branches:
      - eros-develop
      - eros
    paths-ignore:
      - "src/NzbDrone.Core/Localization/Core/**"

concurrency:
  # pull_request.number is empty on push, so keying on it alone put every push
  # run - eros and eros-develop alike - in one group named "Build-pr-", where
  # each merge cancelled whatever was building on the other branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR run is useful; killing a half-finished release build that
  # packages 11 runtimes and publishes a release is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FRAMEWORK: net10.0
  RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  WHISPARR_MAJOR_VERSION: 3
  # Base version now comes from the newest base tag (vX.Y.Z) reachable from the
  # building branch; this is only the fallback for the seed window before any
  # base tag exists. See prepare job below.
  VERSION_FALLBACK: 3.3.4

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      framework: ${{ steps.variables.outputs.framework }}
      major_version: ${{ steps.variables.outputs.major_version }}
      version: ${{ steps.variables.outputs.version }}
      assembly_version: ${{ steps.variables.outputs.assembly_version }}
      branch: ${{ steps.variables.outputs.branch }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # `git tag --merged HEAD` below needs the whole commit graph, so this
          # one job cannot go shallow. tree:0 makes it a treeless partial clone:
          # the commits and tags arrive (~5 MB), the trees and blobs behind them
          # (~360 MB) do not. Every other job in this workflow builds or tests
          # from a downloaded artifact and reads no history at all - leave those
          # on the default shallow checkout.
          fetch-depth: 0
          filter: tree:0

      - name: Setup Environment Variables
        id: variables
        shell: bash
        run: |
          # Base version = highest base tag (strictly vX.Y.Z) reachable from THIS
          # branch's history. --merged keeps it reachability-scoped so eros-develop
          # and eros each resolve their own base; the strict regex rejects both the
          # CI-minted -develop.N/-release.N tags and the legacy 4-part vX.Y.Z.B tags
          # inherited from upstream (which glob-based matching cannot separate).
          # `|| true` keeps the default bash `-eo pipefail` shell from aborting the
          # step when no base tag matches yet (seed window) or when `head` closes the
          # pipe early (SIGPIPE).
          BASE_TAG=$(git tag --merged HEAD --sort=-v:refname 2>/dev/null \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "$BASE_TAG" ]; then
            BASE="${BASE_TAG#v}"
            echo "Base version ${BASE} (from tag ${BASE_TAG})"
          else
            BASE="${{ env.VERSION_FALLBACK }}"
            echo "Base version ${BASE} (from VERSION_FALLBACK; no vX.Y.Z tag reachable)"
          fi

          # Deleting a base tag that CI has already built from walks the version
          # backwards without failing anything: the next run just resolves the
          # next tag down and publishes a release that looks like a downgrade to
          # every updater in the field. Every CI-minted tag records the base it
          # came from, so compare against the highest of those and stop instead.
          PUBLISHED=$(git tag --merged HEAD 2>/dev/null \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-(develop|release)\.[0-9]+$' \
            | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-.*$/\1/' \
            | sort -V | tail -n1 || true)
          if [ -n "$PUBLISHED" ] && [ "$(printf '%s\n%s\n' "$BASE" "$PUBLISHED" | sort -V | tail -n1)" != "$BASE" ]; then
            echo "::error::Base version ${BASE} is behind ${PUBLISHED}, which this branch has already published. The v${PUBLISHED} base tag is missing - restore it with 'git push origin v${PUBLISHED}' before merging."
            exit 1
          fi

          if [[ "${{ github.ref_name }}" == "eros-develop" ]]; then
            SEMVER_LABEL="develop"
          else
            SEMVER_LABEL="release"
          fi
          echo "framework=${{ env.FRAMEWORK }}" >> "$GITHUB_OUTPUT"
          echo "major_version=${{ env.WHISPARR_MAJOR_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "version=${BASE}-${SEMVER_LABEL}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "assembly_version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "branch=${RAW_BRANCH_NAME//\//-}" >> "$GITHUB_OUTPUT"

  backend:
    needs: prepare
    permissions:
      contents: read
      # The build action adds the private gh-openur feed authenticated with
      # github.token; without this the freebsd-x64 runtime packs 403.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: freebsd-x64
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-arm
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-arm64
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-musl-arm64
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-musl-x64
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-x64
            package_tests: true
            os: ubuntu-latest
          - runtime: osx-arm64
            package_tests: true
            os: ubuntu-latest
          - runtime: osx-x64
            package_tests: false
            os: ubuntu-latest
          - runtime: win-x64
            package_tests: true
            os: ubuntu-latest
          - runtime: win-x86
            package_tests: false
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/actions/build
        with:
          branch: ${{ needs.prepare.outputs.branch }}
          version: ${{ needs.prepare.outputs.version }}
          assembly_version: ${{ needs.prepare.outputs.assembly_version }}
          framework: ${{ needs.prepare.outputs.framework }}
          runtime: ${{ matrix.runtime }}
          package_tests: ${{ matrix.package_tests }}

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Volta
        uses: volta-cli/action@v5

      - name: Yarn Install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Stylelint
        run: yarn stylelint-linux

      - name: Build
        run: yarn build --env production

      - name: Publish UI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build_ui
          path: _output/UI/**/*

  unit_test:
    needs: backend
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: tests-linux-x64
            binary_artifact: build-linux-x64
            filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest
          - os: macos-latest
            artifact: tests-osx-arm64
            binary_artifact: build-osx-arm64
            filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest
          - os: windows-latest
            artifact: tests-win-x64
            binary_artifact: build-win-x64
            filter: TestCategory!=ManualTest&TestCategory!=LINUX&TestCategory!=IntegrationTest&TestCategory!=AutomationTest
            # Sonar wants one coverage report, not three. Windows is the leg
            # that produces it because sonarqube.yml analyses on windows-latest
            # too, so the source paths in the report match the ones the scanner
            # records. Collecting on a different OS than the analysis risks
            # coverage that imports but maps to nothing.
            collect_coverage: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test
        uses: ./.github/actions/test
        with:
          os: ${{ matrix.os }}
          artifact: ${{ matrix.artifact }}
          pattern: Whisparr.*.Test.dll
          filter: ${{ matrix.filter }}
          collect_coverage: ${{ matrix.collect_coverage }}

  unit_test_postgres:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 17, 18]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test
        uses: ./.github/actions/test
        with:
          os: ubuntu-latest
          artifact: tests-linux-x64
          pattern: Whisparr.*.Test.dll
          filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest
          use_postgres: true
          postgres-version: ${{ matrix.postgres-version }}

  integration_test:
    needs: [prepare, backend]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: tests-linux-x64
            filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory=IntegrationTest
            binary_artifact: build-linux-x64
            binary_path: linux-x64/${{ needs.prepare.outputs.framework }}/Whisparr
          - os: macos-latest
            artifact: tests-osx-arm64
            filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory=IntegrationTest
            binary_artifact: build-osx-arm64
            binary_path: osx-arm64/${{ needs.prepare.outputs.framework }}/Whisparr
          - os: windows-latest
            artifact: tests-win-x64
            filter: TestCategory!=ManualTest&TestCategory!=LINUX&TestCategory=IntegrationTest
            binary_artifact: build-win-x64
            binary_path: win-x64/${{ needs.prepare.outputs.framework }}/Whisparr
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Test
        uses: ./.github/actions/test
        with:
          os: ${{ matrix.os }}
          artifact: ${{ matrix.artifact }}
          pattern: Whisparr.*.Test.dll
          filter: ${{ matrix.filter }}
          integration_tests: true
          binary_artifact: ${{ matrix.binary_artifact }}
          binary_path: ${{ matrix.binary_path }}

  deploy:
    needs:
      [
        prepare,
        backend,
        frontend,
        unit_test,
        unit_test_postgres,
        integration_test,
      ]
    secrets: inherit
    uses: ./.github/workflows/deploy.yml
    with:
      framework: ${{ needs.prepare.outputs.framework }}
      branch: ${{ github.ref_name }}
      major_version: ${{ needs.prepare.outputs.major_version }}
      version: ${{ needs.prepare.outputs.version }}
