name: Test
description: Runs unit/integration tests

inputs:
  use_postgres:
    description: 'Whether postgres should be used for the database'
  postgres-version:
    description: 'Which postgres version should be used for the database'
  os:
    description: 'OS that the tests are running on'
    required: true
  artifact:
    description: 'Test binary artifact'
    required: true
  pattern:
    description: 'Pattern for DLLs'
    required: true
  filter:
    description: 'Filter for tests'
    required: true
  integration_tests:
    description: 'True if running integration tests'
  binary_artifact:
    description: 'Binary artifact for integration tests'
  binary_path:
    description: 'Path within binary artifact for integration tests'
  collect_coverage:
    description: >-
      Collect OpenCover coverage and publish it as the `coverage-<results name>`
      artifact, for sonarqube.yml to consume. Enabled on exactly one leg - see
      build_v3.yml - because Sonar needs one consistent report, not a matrix of
      them. Coverage is produced HERE, in the untrusted `pull_request` context
      with no secrets in scope, precisely so that sonarqube.yml never has to run
      fork test code while holding SONAR_TOKEN.

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Setup Postgres
      if: ${{ inputs.use_postgres }}
      uses: ikalnytskyi/action-setup-postgres@v8
      with:
        postgres-version: ${{ inputs.postgres-version }}

    - name: Setup Test Variables
      shell: bash
      run: |
        echo "RESULTS_NAME=${{ inputs.integration_tests && 'integation-' || 'unit-' }}${{ inputs.artifact }}${{ inputs.use_postgres && '-postgres' }}${{ inputs.use_postgres && inputs.postgres-version && inputs.postgres-version }}" >> "$GITHUB_ENV"

    - name: Setup Postgres Environment Variables
      if: ${{ inputs.use_postgres }}
      shell: bash
      run: |
        echo "Whisparr__Postgres__Host=localhost" >> "$GITHUB_ENV"
        echo "Whisparr__Postgres__Port=5432" >> "$GITHUB_ENV"
        echo "Whisparr__Postgres__User=postgres" >> "$GITHUB_ENV"
        echo "Whisparr__Postgres__Password=postgres" >> "$GITHUB_ENV"

    - name: Download Tests Artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: _tests

    - name: Download Binary Artifact
      if: ${{ inputs.integration_tests }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.binary_artifact }}
        path: _output


    - name: Set up binary artifact
      if: ${{ inputs.binary_path != '' }}
      shell: bash
      run: |
        mv ./_output/${{inputs.binary_path}} _tests/bin
        echo "Moved Whisparr binary to _tests/bin."
        if [ -f "_tests/bin/Whisparr" ]; then
          echo "_tests/bin/Whisparr exists."
        else
          echo "ERROR: _tests/bin/Whisparr does not exist!" >&2
          exit 1
        fi
        ls -l _tests/bin/Whisparr


    - name: Make executable
      if: startsWith(inputs.os, 'windows') != true
      shell: bash
      run: chmod +x ./_tests/Whisparr.Test.Dummy && chmod +x ./_tests/ffprobe

    - name: Make Whisparr binary executable and verify
      if: ${{ inputs.integration_tests && !startsWith(inputs.os, 'windows') }}
      shell: bash
      run: |
        chmod +x ./_tests/bin/Whisparr
        if [ -x "./_tests/bin/Whisparr" ]; then
          echo "_tests/bin/Whisparr is executable."
        else
          echo "ERROR: _tests/bin/Whisparr is NOT executable!" >&2
          exit 1
        fi
        ls -l ./_tests/bin/Whisparr

    - name: Run tests
      shell: bash
      env:
        COLLECT_COVERAGE: ${{ inputs.collect_coverage }}
      run: |
        # coverlet.collector is already referenced by every test project
        # (src/Directory.Build.props). Its default output is Cobertura, which
        # the Sonar .NET scanner cannot read, hence Format=opencover.
        #
        # ExcludeAssembliesWithoutSources=None is load-bearing. By default
        # coverlet skips any assembly whose PDB has no locally-resolvable source
        # document, and src/Directory.Build.props sets
        # <PathMap>$(MSBuildThisFileDirectory)=./</PathMap>, which rewrites every
        # document to "./NzbDrone.Core/..." - a path that resolves nowhere,
        # because the real file lives under src/. The only documents left with
        # absolute paths are three generated AssemblyInfo files under _temp/obj,
        # and those point at the machine that BUILT the assemblies. Tests here
        # run on a different runner against a downloaded artifact, so they do not
        # exist either, every module gets skipped, and coverlet emits a 363-byte
        # report containing <Modules />. That is what shipped in #439.
        #
        # Include=[Whisparr.*]* then narrows instrumentation back to our own
        # assemblies; without it, disabling the source check pulls in Dapper,
        # MonoTorrent and friends and nearly doubles the report for no gain.
        coverage_args=()
        if [ "$COLLECT_COVERAGE" = "true" ]; then
          coverage_args=(--collect:"XPlat Code Coverage;Format=opencover;ExcludeAssembliesWithoutSources=None;Include=[Whisparr.*]*" --results-directory coverage)
        fi
        dotnet test ./_tests/Whisparr.*.Test.dll --filter "${{ inputs.filter }}" "${coverage_args[@]}" --logger "trx;LogFileName=${{ env.RESULTS_NAME }}.trx" --logger "GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true"

    - name: Upload Test Results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: results-${{ env.RESULTS_NAME }}
        path: TestResults/*.trx

    # Consumed by sonarqube.yml. Uploaded even on failure: a red suite still
    # produces valid coverage for the tests that did run, and Sonar reporting
    # 0% because of an unrelated test failure is worse than a partial figure.
    - name: Upload Coverage
      if: ${{ !cancelled() && inputs.collect_coverage == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ env.RESULTS_NAME }}
        path: coverage/**/coverage.opencover.xml
        if-no-files-found: error
