# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    # A dependency joins the FIRST group it matches, so the coupled families
    # are listed before the catch-all dev/prod groups. Anything matching no
    # group gets its own PR -- which is how majors end up one-per-PR.
    groups:
      # Coupled families: these have to move together, majors included.
      babel:
        patterns:
          - "@babel/*"
          - "babel-loader"
          - "babel-plugin-*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
      # Every member of this group is currently ignored (see below), so it
      # produces no PRs today. Kept so grouping still applies if the redux
      # migration is ever abandoned and the ignore entries are dropped.
      redux:
        patterns:
          - "redux"
          - "redux-*"
          - "react-redux"
          - "reselect"
      react-router:
        patterns:
          - "react-router"
          - "react-router-dom"
      # Everything else: batched by intent, majors excluded so they land alone.
      dev-minor:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-minor:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Each of these needs source changes, not just a version bump. Drop the
      # entry when we're ready to do that migration.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-window"
        update-types: ["version-update:semver-major"]
      - dependency-name: "swiper"
        update-types: ["version-update:semver-major"]
      # The redux family is being removed, not upgraded. The frontend is
      # migrating to React Query and zustand, after which every one of these
      # is deleted from package.json. Bumping them in the meantime is churn
      # against code with a scheduled demolition date -- react-redux 9.3.0,
      # which #395 kept proposing, exists mainly to mark `connect` deprecated,
      # and we still have 66 connectors to delete rather than migrate.
      #
      # No update-types filter: ignore every update, not just majors. Drop
      # these entries only if the migration is abandoned.
      #
      # reselect is included because it is only used by redux selectors, and
      # @types/redux-actions needs naming explicitly -- it matches none of the
      # redux group's patterns, so it would otherwise land in prod-minor.
      - dependency-name: "redux"
      - dependency-name: "redux-*"
      - dependency-name: "react-redux"
      - dependency-name: "reselect"
      - dependency-name: "@types/redux-actions"
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
    groups:
      all-nuget-updates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows. The composite actions under
    # .github/actions/*/action.yml pin their own `uses:` versions and drift
    # independently, so they need their own glob - without it they are invisible
    # to Dependabot.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    # Same intent as the npm groups above: batch the safe updates, leave majors
    # ungrouped so each one lands in its own reviewable PR. Action majors have
    # bitten us before - checkout v7 added the fork-checkout block that broke
    # SonarQube on every fork PR - so they deserve individual review.
    #
    # First match wins, so coupled families go before the catch-all.
    groups:
      # upload/download-artifact have to move together: the download side must
      # be able to read what the upload side wrote, and each directory above is
      # a separate Dependabot run, so without this group a single bump arrives
      # as one PR per file - eight of them, half of which collide on the same
      # file. Majors are included here deliberately, unlike the rule below.
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # Same one-PR-per-file problem, different cause: setup-dotnet is pinned in
      # .github/workflows plus two composite actions, so a single major arrived
      # as three PRs. Grouping it keeps the "one PR per action major" intent the
      # comment above describes - the split was never wanted, it just falls out
      # of `directories`. Only actions pinned in more than one directory need an
      # entry here; checkout lives solely in .github/workflows and is fine
      # ungrouped.
      setup-dotnet:
        patterns:
          - "actions/setup-dotnet"
        update-types:
          - "major"
          - "minor"
          - "patch"
      actions-minor:
        update-types:
          - "minor"
          - "patch"
